    (function(){
      function normPage(p){ return (p || '').split('?')[0].split('#')[0].split('/').pop().replace(/\.html$/, '') || 'index'; }
      var nav = document.getElementById('sitenav');
      var toggle = document.getElementById('sitenavToggle');
      var currentEl = document.getElementById('sitenavCurrent');
      function closeMenu(){ if(nav) nav.classList.remove('open'); if(toggle) toggle.setAttribute('aria-expanded','false'); }
      function setActive(page){
        var current = normPage(page || location.pathname);
        var activeText = '';
        document.querySelectorAll('#sitenav .sitenav-links a').forEach(function(a){
          var on = normPage(a.getAttribute('href')) === current;
          a.classList.toggle('active', on);
          if(on) activeText = a.textContent;
        });
        if(!activeText){ var nt = document.body.getAttribute('data-nav-title'); if(nt){ activeText = nt; } else { var h = document.querySelector('h1'); if(h) activeText = h.textContent.trim(); } }
        if(currentEl) currentEl.textContent = activeText;
      }
      if(toggle){ toggle.addEventListener('click', function(){ var open = nav.classList.toggle('open'); toggle.setAttribute('aria-expanded', open ? 'true' : 'false'); }); }
      document.querySelectorAll('#sitenav .sitenav-links a').forEach(function(a){ a.addEventListener('click', closeMenu); });
      setActive();
      document.addEventListener('DOMContentLoaded', function(){ setActive(); });
      document.addEventListener('turbo:load', function(){ setActive(); closeMenu(); });
      document.addEventListener('turbo:click', function(e){ setActive(e.detail.url); });
    })();

<script>
(function(){
// ── Grade colours (same rubric as the scorecard) ───────────────────
const GRADE_BG = {
  'A': '#2D5A3D', 'B': '#4CAF73', 'C': '#A8D5B0',
  'D': '#F2A0A0', 'E': '#D94040', 'F': '#8B1A1A', 'DNR': '#F0D080', '?': '#cccccc',
};
const GRADE_DISPLAY = { '?': 'TBC', 'DNR': '?' };
const GRADE_DARK_TEXT = new Set(['C', 'D', 'DNR', '?']);
const GRADE_ORDER = ['A', 'B', 'C', 'DNR', '?', 'D', 'E', 'F'];

// Colour-blind-safe palette: same good→bad gradient, ramped blue→orange instead
// of green→red. Lightness matches GRADE_BG so GRADE_DARK_TEXT stays correct.
const GRADE_BG_CB = {
  'A': '#08519C', 'B': '#3182BD', 'C': '#C6DBEF',
  'D': '#FDD0A2', 'E': '#E6550D', 'F': '#A63603', 'DNR': '#F0D080', '?': '#cccccc',
};
// Blue–yellow (tritan) palette: green (good) → magenta (bad).
const GRADE_BG_CB_BY = {
  'A': '#276419', 'B': '#7FBC41', 'C': '#E6F5D0',
  'D': '#FDE0EF', 'E': '#C51B7D', 'F': '#8E0152', 'DNR': '#F0D080', '?': '#cccccc',
};

let colourblind = false;
let cbBlueYellow = false;
try { colourblind = localStorage.getItem('bbai-map-cb') === '1'; } catch {}
try { cbBlueYellow = localStorage.getItem('bbai-map-by') === '1'; } catch {}

function gradePalette() {
  if (!colourblind) return GRADE_BG;
  return cbBlueYellow ? GRADE_BG_CB_BY : GRADE_BG_CB;
}
function gradeColour(grade) { return gradePalette()[grade] || '#cccccc'; }

// ── State ─────────────────────────────────────────────────────────
let regions      = [];   // [{ name }]
let candidatesDB = {};   // keyed by exact region name, from data.json
let ratingsMap   = {};   // confirmed ratings from Supabase, keyed by region — ARRAY per region
let memberCounts = {};   // keyed by region name
let latestRegion = null; // region of the most recent signup
let view         = 'grade';
let maxMembers   = 0;
let searchQuery  = '';

function stripHonorifics(s) {
  return (s || '')
    .replace(/^(Ing\.?|Mgr\.?|JUDr\.?|MUDr\.?|MVDr\.?|PhDr\.?|RNDr\.?|Bc\.?|BcA\.?|MgA\.?|Dr\.?|doc\.?|prof\.?)\s+(arch\.?\s+)?/i, '')
    .trim();
}

function escHTML(s) {
  return (s || '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// Every current deputy for a region, with the confirmed-ratings overlay applied
// (matched by deputy name — a region can carry several confirmed ratings).
function currentDeputies(regionName) {
  const list = (candidatesDB[regionName] || []).filter(c => c.current_mp);
  const ratings = ratingsMap[regionName] || [];
  if (!ratings.length) return list;
  const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  return list.map(c => {
    const r = ratings.find(r => norm(stripHonorifics(r.mp_name)) === norm(stripHonorifics(c.name)));
    return r ? { ...c, grade: r.grade } : c;
  });
}

function bestGrade(deps) {
  let best = null;
  for (const d of deps) {
    const g = (d.grade || '?').toUpperCase();
    if (best === null || GRADE_ORDER.indexOf(g) < GRADE_ORDER.indexOf(best)) best = g;
  }
  return best || '?';
}

// ── Load data.json + live member counts ───────────────────────────
async function init() {
  try {
    const [dataRes, countsRes, ratingsRes, latestRes] = await Promise.all([
      fetch('/data.json'),
      fetch('/api/member-counts').catch(() => null),
      fetch('/api/current-ratings', { cache: 'no-store' }).catch(() => null),
      fetch('/api/latest-member', { cache: 'no-store' }).catch(() => null),
    ]);
    if (!dataRes.ok) throw new Error(`HTTP ${dataRes.status}`);

    const data = await dataRes.json();
    regions      = data.constituencies || [];
    candidatesDB = data.candidates || {};

    if (ratingsRes && ratingsRes.ok) {
      try { ({ ratings: ratingsMap } = await ratingsRes.json()); ratingsMap = ratingsMap || {}; }
      catch (e) { console.warn('current-ratings parse error:', e); }
    }

    if (countsRes && countsRes.ok) {
      try { memberCounts = await countsRes.json(); }
      catch (e) { console.warn('member-counts parse error:', e); }
    } else if (countsRes) {
      console.warn('member-counts API error:', countsRes.status);
    }
    maxMembers = Math.max(...regions.map(r => memberCounts[r.name] || 0), 1);

    if (latestRes && latestRes.ok) {
      try { ({ constituency: latestRegion } = await latestRes.json()); }
      catch (e) { console.warn('latest-member parse error:', e); }
    }

    // Handle ?constituency= deep-link
    const urlCon = new URLSearchParams(location.search).get('constituency');
    if (urlCon) {
      document.getElementById('search-box').value = urlCon;
      searchQuery = urlCon.toLowerCase();
    }

    document.getElementById('map-status').style.display = 'none';
    render();
  } catch (e) {
    document.getElementById('map-status').textContent =
      'Nepodařilo se načíst data. Zkuste prosím obnovit stránku.';
  }
}

// ── Matching / search ────────────────────────────────────────────
function matchesSearch(regionName, q) {
  if (!q) return true;
  if (regionName.toLowerCase().includes(q)) return true;
  return currentDeputies(regionName).some(d =>
    (d.name || '').toLowerCase().includes(q) ||
    stripHonorifics(d.name || '').toLowerCase().includes(q));
}

// ── Render ────────────────────────────────────────────────────────
function render() {
  const list = document.getElementById('region-list');
  list.innerHTML = '';
  const filtered = searchQuery ? regions.filter(r => matchesSearch(r.name, searchQuery)) : null;

  for (const region of regions) {
    const deps     = currentDeputies(region.name);
    const members  = memberCounts[region.name] || 0;
    const isMatch  = !filtered || filtered.some(r => r.name === region.name);
    const card     = document.createElement('div');
    card.className = 'region-card' + (filtered ? (isMatch ? ' highlighted' : ' dimmed') : '');

    const depRows = deps.length
      ? deps.map(d => {
          const g = (d.grade || '?').toUpperCase();
          const bg = gradeColour(g);
          const badge = view === 'grade'
            ? `<span class="grade-badge" style="background:${bg};color:${GRADE_DARK_TEXT.has(g) ? '#333' : '#fff'}">${GRADE_DISPLAY[g] ?? g}</span>`
            : '';
          return `<div class="deputy-row">
            <span><span class="dep-name">${escHTML(d.name)}</span>${d.party ? `<span class="dep-party">${escHTML(d.party)}</span>` : ''}</span>
            ${badge}
          </div>`;
        }).join('')
      : '<div class="no-deputy">Zatím nebyl označen žádný sedící poslanec</div>';

    const memberBadge = view === 'member'
      ? `<span class="grade-badge" style="background:${members ? '#2d5fc0' : '#e0e0e0'};color:#fff">${members}</span>`
      : `<span class="region-members">${members} signatář${members === 1 ? '' : (members >= 2 && members <= 4 ? 'i' : 'ů')}</span>`;

    card.innerHTML = `
      <div class="region-card-head">
        <h3>${escHTML(region.name)}${latestRegion === region.name ? '<span class="region-newest">★ Nejnovější podpis</span>' : ''}</h3>
        ${memberBadge}
      </div>
      <div class="deputy-rows">${depRows}</div>
      <a class="scorecard-link" href="scorecard.html?constituency=${encodeURIComponent(region.name)}">Zobrazit hodnocení →</a>
    `;
    list.appendChild(card);
  }

  renderLegend();
}

// ── Legend ────────────────────────────────────────────────────────
function renderLegend() {
  const el = document.getElementById('legend');
  if (view === 'grade') {
    const gradeEntries = Object.entries(gradePalette());
    const mainGrades = gradeEntries.filter(([g]) => g !== 'DNR' && g !== '?');
    const dnrGrade = gradeEntries.find(([g]) => g === 'DNR');
    const notScoredGrade = gradeEntries.find(([g]) => g === '?');
    el.innerHTML = `
      <div class="legend-title">Hodnocení bezpečnosti AI</div>
      <div class="legend-subtitle legend-subtitle-muted">Za každého současného poslance, od BBAI</div>
      <div class="legend-items">
        ${mainGrades.map(([grade, colour]) => `
          <div class="legend-item">
            <span class="grade-badge" style="background:${colour};color:${GRADE_DARK_TEXT.has(grade) ? '#333' : '#fff'}">${grade}</span>
            <span>Známka ${grade}</span>
          </div>`).join('')}
        <div class="legend-separator"></div>
        ${dnrGrade ? `
          <div class="legend-item">
            <span class="grade-badge" style="background:${dnrGrade[1]};color:#333">?</span>
            <span>Bez odpovědi</span>
          </div>` : ''}
        ${notScoredGrade ? `
          <div class="legend-item">
            <span class="grade-badge" style="background:${notScoredGrade[1]};color:#333">TBC</span>
            <span>Nehodnoceno</span>
          </div>` : ''}
      </div>
      <div class="cb-group expanded" id="cb-group" style="margin-top:14px">
        <button type="button" id="btn-cb" class="cb-toggle" aria-pressed="${colourblind}" title="Použít paletu vhodnou pro barvoslepost (modro-oranžová místo zeleno-červené)">Režim pro barvoslepost</button>
        <button type="button" id="btn-cb-by" class="cb-toggle cb-sub" aria-pressed="${cbBlueYellow}" title="Přepnout na paletu pro modro-žlutou barvoslepost (tritanopii): zeleno-purpurová místo modro-oranžové" ${colourblind ? '' : 'hidden'}>Modro-žlutá barvoslepost</button>
      </div>
      <div class="legend-info">
        <span class="legend-info-link" id="gradeInfoLink">Jak se známky počítají?</span>
      </div>`;
    document.getElementById('btn-cb').addEventListener('click', () => setColourblind(!colourblind));
    const byBtn = document.getElementById('btn-cb-by');
    if (byBtn) byBtn.addEventListener('click', () => setBlueYellow(!cbBlueYellow));
  } else {
    el.innerHTML = `
      <div class="legend-title">Signatáři BBAI</div>
      <div class="legend-subtitle legend-subtitle-muted">Signatáři BBAI podle kraje</div>
      <div class="legend-items">
        <div class="legend-item"><span>Řazeno podle počtu podpisů. Tmavší = více signatářů.</span></div>
      </div>`;
  }
}

function setColourblind(on) {
  colourblind = !!on;
  try { localStorage.setItem('asva-map-cb', colourblind ? '1' : '0'); } catch {}
  render();
}
function setBlueYellow(on) {
  cbBlueYellow = !!on;
  try { localStorage.setItem('asva-map-by', cbBlueYellow ? '1' : '0'); } catch {}
  render();
}

// ── View toggle ───────────────────────────────────────────────────
function setView(v) {
  view = v;
  document.getElementById('btn-grade').classList.toggle('active',  v === 'grade');
  document.getElementById('btn-member').classList.toggle('active', v === 'member');
  if (v === 'member') {
    regions = regions.slice().sort((a, b) => (memberCounts[b.name] || 0) - (memberCounts[a.name] || 0));
  } else {
    regions = regions.slice().sort((a, b) => a.name.localeCompare(b.name, 'cs'));
  }
  render();
}
document.getElementById('btn-grade').addEventListener('click', () => setView('grade'));
document.getElementById('btn-member').addEventListener('click', () => setView('member'));

// ── Search + dropdown ────────────────────────────────────────────
const searchBox      = document.getElementById('search-box');
const searchDropdown = document.getElementById('map-search-dropdown');

function hideDropdown() { searchDropdown.style.display = 'none'; }
function addDropdownGroup(text) {
  const el = document.createElement('div');
  el.className = 'dropdown-group';
  el.textContent = text;
  searchDropdown.appendChild(el);
}
function pickFromDropdown(regionName, label) {
  searchBox.value = label;
  searchQuery = label.toLowerCase().trim();
  hideDropdown();
  render();
}
function showDropdown(term) {
  term = (term || '').toLowerCase().trim();
  if (!term) { hideDropdown(); return; }

  const consMatches = regions.filter(r => r.name.toLowerCase().includes(term));
  const depMatches = [];
  for (const r of regions) {
    for (const d of currentDeputies(r.name)) {
      if ((d.name || '').toLowerCase().includes(term) || stripHonorifics(d.name).toLowerCase().includes(term)) {
        depMatches.push({ region: r.name, name: d.name, party: d.party });
      }
    }
  }

  if (!consMatches.length && !depMatches.length) {
    searchDropdown.innerHTML = '<div class="dropdown-item" style="color:#999">Nic nenalezeno</div>';
    searchDropdown.style.display = 'block';
    return;
  }

  searchDropdown.innerHTML = '';
  const showLabels = consMatches.length && depMatches.length;
  if (consMatches.length) {
    if (showLabels) addDropdownGroup('Kraje');
    consMatches.slice(0, 12).forEach(r => {
      const item = document.createElement('div');
      item.className = 'dropdown-item';
      item.textContent = r.name;
      item.addEventListener('click', () => pickFromDropdown(r.name, r.name));
      searchDropdown.appendChild(item);
    });
  }
  if (depMatches.length) {
    if (showLabels) addDropdownGroup('Poslanci');
    depMatches.slice(0, 12).forEach(d => {
      const item = document.createElement('div');
      item.className = 'dropdown-item dropdown-person';
      const sub = [d.party, d.region].filter(Boolean).join(' · ');
      item.innerHTML = '<span class="dp-name">' + escHTML(d.name) + '</span>' +
                       (sub ? '<span class="dp-sub"> · ' + escHTML(sub) + '</span>' : '');
      item.addEventListener('click', () => pickFromDropdown(d.region, d.name));
      searchDropdown.appendChild(item);
    });
  }
  searchDropdown.style.display = 'block';
}
searchBox.addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase().trim();
  render();
  showDropdown(e.target.value);
});
searchBox.addEventListener('focus', () => showDropdown(searchBox.value));
document.addEventListener('click', e => {
  if (!searchBox.contains(e.target) && !searchDropdown.contains(e.target)) hideDropdown();
});

// ── Grade info tooltip (follow-cursor) ───────────────────────────
(function() {
  const tip = document.createElement('div');
  tip.style.cssText = 'display:none;position:fixed;background:#111;color:#fff;border-radius:8px;padding:12px 14px;width:240px;font-size:0.78rem;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.35);z-index:9999;pointer-events:none;';
  tip.innerHTML = '<p style="margin-bottom:8px;">Známky vycházejí z veřejně dostupných informací nebo informací zaslaných BBAI. Tyto informace jsou zobrazeny v hodnocení daného kraje.</p><p style="margin-bottom:8px;">Bez odpovědi znamená, že jsme nenašli dostatek veřejných informací a poslanec neodpověděl na dotazy od BBAI.</p><p>Nehodnoceno znamená, že BBAI tohoto poslance zatím nehodnotilo.</p>';
  document.body.appendChild(tip);

  function positionTip(x, y) {
    const margin = 8;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = x + 14;
    if (left + tw > window.innerWidth - margin) left = x - 14 - tw;
    left = Math.max(margin, Math.min(left, window.innerWidth - tw - margin));
    let top = y + 14;
    if (top + th > window.innerHeight - margin) top = y - 14 - th;
    top = Math.max(margin, Math.min(top, window.innerHeight - th - margin));
    tip.style.left = left + 'px';
    tip.style.top  = top + 'px';
  }

  document.getElementById('legend').addEventListener('mouseover', e => {
    if (e.target.closest('#gradeInfoLink')) { tip.style.display = 'block'; positionTip(e.clientX, e.clientY); }
  });
  document.getElementById('legend').addEventListener('mousemove', e => {
    if (e.target.closest('#gradeInfoLink')) positionTip(e.clientX, e.clientY);
  });
  document.getElementById('legend').addEventListener('mouseout', e => {
    if (e.target.closest('#gradeInfoLink')) tip.style.display = 'none';
  });
})();

// ── Boot ──────────────────────────────────────────────────────────
init();
})();
</script>
